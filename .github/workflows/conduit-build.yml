name: Conduit Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Conduit-Club/PCL-CE-SHOU'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish baseline
        shell: pwsh
        run: ./scripts/conduit/Publish.ps1
      - name: Test
        shell: pwsh
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64
      - uses: actions/upload-artifact@v7
        with:
          name: PCL-CE-SHOU-win-x64
          path: |
            artifacts/conduit/*.zip
            artifacts/conduit/*.sha256
          if-no-files-found: error
